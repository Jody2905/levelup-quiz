{% extends "base.html" %}
{% block title %}Log in · LevelUp Quiz{% endblock %}
{% block content %}
<div class="panel narrow">
  <h1>Log in</h1>
  {% if locked_message %}<div class="flash flash-error">{{ locked_message }}</div>{% endif %}
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <input type="hidden" name="next" value="{{ next }}">
    <button class="btn btn-wide">Log in</button>
  </form>
  <p class="muted">New here? <a href="{% url 'signup' %}">Create an account</a></p>
</div>
{% endblock %}

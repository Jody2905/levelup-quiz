{% extends "base.html" %}
{% block title %}Sign up · LevelUp Quiz{% endblock %}
{% block content %}
<div class="panel narrow">
  <h1>Create an account</h1>
  {% if limit_message %}<div class="flash flash-error">{{ limit_message }}</div>{% endif %}
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="btn btn-wide">Sign up</button>
  </form>
  <p class="muted">Already have an account? <a href="{% url 'login' %}">Log in</a></p>
</div>
{% endblock %}
